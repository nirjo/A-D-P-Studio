<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="leather-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <pattern id="saffiano-crosshatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#000000" stroke-width="0.5" stroke-opacity="0.18" />
      <path d="M 0 0 L 6 6 M 6 0 L 0 6" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.12" />
    </pattern>
    <linearGradient id="gold-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#ca8a04" />
      <stop offset="70%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="lens-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g filter="url(#leather-shadow)">
    <!-- Shock Frame Rim -->
    <rect x="80" y="40" width="240" height="520" rx="42" fill="#18181b" stroke="#27272a" stroke-width="2" />

    <!-- Recolor Saffiano Leather Base -->
    <rect id="leather-color-body" x="82" y="42" width="236" height="516" rx="40" fill="#111111" />

    <!-- Cross-Grain Texture Pattern -->
    <rect x="82" y="42" width="236" height="516" rx="40" fill="url(#saffiano-crosshatch)" />

    <!-- Hand-Stitched Perimeter Accent -->
    <rect x="90" y="50" width="220" height="500" rx="34" fill="none" stroke="url(#gold-foil)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.65" />

    <!-- Metallic Gold Camera Surround Bezel -->
    <rect x="98" y="60" width="102" height="110" rx="26" fill="#1c1917" stroke="url(#gold-foil)" stroke-width="2.5" />
    <rect x="100" y="62" width="98" height="106" rx="24" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25" />

    <!-- Lens 1 with Gold Trim -->
    <circle cx="130" cy="92" r="19" fill="#09090b" stroke="url(#gold-foil)" stroke-width="1.5" />
    <circle cx="130" cy="92" r="13" fill="#000000" />
    <circle cx="130" cy="92" r="9" fill="url(#lens-glare)" opacity="0.7" />
    <circle cx="128" cy="89" r="3" fill="#ffffff" opacity="0.7" />

    <!-- Lens 2 with Gold Trim -->
    <circle cx="130" cy="138" r="19" fill="#09090b" stroke="url(#gold-foil)" stroke-width="1.5" />
    <circle cx="130" cy="138" r="13" fill="#000000" />
    <circle cx="130" cy="138" r="9" fill="url(#lens-glare)" opacity="0.7" />
    <circle cx="128" cy="135" r="3" fill="#ffffff" opacity="0.7" />

    <!-- Lens 3 with Gold Trim -->
    <circle cx="172" cy="115" r="17" fill="#09090b" stroke="url(#gold-foil)" stroke-width="1.5" />
    <circle cx="172" cy="115" r="11" fill="#000000" />
    <circle cx="172" cy="115" r="7" fill="url(#lens-glare)" opacity="0.7" />
    <circle cx="170" cy="113" r="2.5" fill="#ffffff" opacity="0.7" />

    <!-- Flash & Sensor -->
    <circle cx="172" cy="78" r="6" fill="#fef9c3" stroke="url(#gold-foil)" stroke-width="1" />
    <circle cx="172" cy="151" r="4" fill="#09090b" stroke="#78716c" stroke-width="1" />

    <!-- Gold Foil Monogram Emblem at Bottom -->
    <circle cx="200" cy="492" r="16" fill="none" stroke="url(#gold-foil)" stroke-width="1.2" opacity="0.9" />
    <text x="200" y="496" font-family="'Syne', serif, sans-serif" font-size="11" font-weight="700" fill="url(#gold-foil)" text-anchor="middle" letter-spacing="1">A</text>
    <text x="200" y="524" font-family="sans-serif" font-size="6" font-weight="600" fill="url(#gold-foil)" text-anchor="middle" letter-spacing="2" opacity="0.85">AIEL ATELIER</text>
  </g>
</svg>
