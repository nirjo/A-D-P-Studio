<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="magsafe-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="slim-matte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="magsafe-metallic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="lens-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <g filter="url(#magsafe-shadow)">
    <!-- Case Edge Rim (Ultra-Slim 1.5mm) -->
    <rect x="80" y="40" width="240" height="520" rx="42" fill="#18181b" stroke="#3f3f46" stroke-width="2" />

    <!-- Recolor Slim Matte Body -->
    <rect id="magsafe-color-body" x="82" y="42" width="236" height="516" rx="40" fill="#0b0c10" />
    <!-- Matte Satin Sheen -->
    <rect x="82" y="42" width="236" height="516" rx="40" fill="url(#slim-matte)" />

    <!-- MagSafe Magnetic Ring Array (Embedded N52 Magnets) -->
    <circle cx="200" cy="310" r="62" fill="none" stroke="url(#magsafe-metallic)" stroke-width="4.5" stroke-dasharray="8 3" opacity="0.85" />
    <!-- MagSafe Inner Ring Indicator -->
    <circle cx="200" cy="310" r="54" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />
    <!-- MagSafe Orientation Pill Alignment Magnet -->
    <rect x="197" y="386" width="6" height="22" rx="3" fill="url(#magsafe-metallic)" opacity="0.85" />

    <!-- Camera Island with Precision Cutout -->
    <rect x="98" y="60" width="102" height="110" rx="26" fill="#18181b" stroke="#27272a" stroke-width="2.5" />
    <rect x="100" y="62" width="98" height="106" rx="24" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2" />

    <!-- Lens 1 -->
    <circle cx="130" cy="92" r="19" fill="#09090b" stroke="#3f3f46" stroke-width="2" />
    <circle cx="130" cy="92" r="13" fill="#000000" />
    <circle cx="130" cy="92" r="9" fill="url(#lens-glare)" opacity="0.75" />
    <circle cx="128" cy="89" r="3" fill="#ffffff" opacity="0.7" />

    <!-- Lens 2 -->
    <circle cx="130" cy="138" r="19" fill="#09090b" stroke="#3f3f46" stroke-width="2" />
    <circle cx="130" cy="138" r="13" fill="#000000" />
    <circle cx="130" cy="138" r="9" fill="url(#lens-glare)" opacity="0.75" />
    <circle cx="128" cy="135" r="3" fill="#ffffff" opacity="0.7" />

    <!-- Lens 3 -->
    <circle cx="172" cy="115" r="17" fill="#09090b" stroke="#3f3f46" stroke-width="2" />
    <circle cx="172" cy="115" r="11" fill="#000000" />
    <circle cx="172" cy="115" r="7" fill="url(#lens-glare)" opacity="0.75" />
    <circle cx="170" cy="113" r="2.5" fill="#ffffff" opacity="0.7" />

    <!-- TrueTone Flash & Sensor -->
    <circle cx="172" cy="78" r="6" fill="#fef3c7" stroke="#78716c" stroke-width="1.5" />
    <circle cx="172" cy="151" r="4" fill="#09090b" stroke="#27272a" stroke-width="1" />

    <!-- Subtle MagSafe Branding -->
    <text x="200" y="313" font-family="sans-serif" font-size="7" font-weight="700" fill="#ffffff" fill-opacity="0.3" text-anchor="middle" letter-spacing="2">MAGSAFE</text>
  </g>
</svg>
