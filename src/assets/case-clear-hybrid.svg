<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="clear-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="clear-glass-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="clear-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="lens-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g filter="url(#clear-shadow)">
    <!-- Shock Cushion Edge TPU Bumper (Crystal Clear Transparent) -->
    <rect x="78" y="38" width="244" height="524" rx="44" fill="none" stroke="url(#clear-border)" stroke-width="4" />
    
    <!-- Phone Chassis Color / Tint Layer -->
    <rect id="clear-color-body" x="82" y="42" width="236" height="516" rx="42" fill="#e2e8f0" fill-opacity="0.85" />

    <!-- Glass Refraction & Glossy Reflection Sweep -->
    <rect x="82" y="42" width="236" height="516" rx="42" fill="url(#clear-glass-glare)" />
    <path d="M 120 42 L 318 240 L 318 360 L 82 124 Z" fill="#ffffff" fill-opacity="0.09" />
    <path d="M 82 280 L 318 516 L 300 558 L 82 340 Z" fill="#ffffff" fill-opacity="0.06" />

    <!-- Raised Clear Camera Island -->
    <rect x="98" y="60" width="102" height="110" rx="24" fill="#ffffff" fill-opacity="0.2" stroke="url(#clear-border)" stroke-width="2" />

    <!-- Lens 1 -->
    <circle cx="130" cy="92" r="19" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="130" cy="92" r="13" fill="#000000" />
    <circle cx="130" cy="92" r="9" fill="url(#lens-glare)" opacity="0.8" />
    <circle cx="128" cy="89" r="3" fill="#ffffff" opacity="0.8" />

    <!-- Lens 2 -->
    <circle cx="130" cy="138" r="19" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="130" cy="138" r="13" fill="#000000" />
    <circle cx="130" cy="138" r="9" fill="url(#lens-glare)" opacity="0.8" />
    <circle cx="128" cy="135" r="3" fill="#ffffff" opacity="0.8" />

    <!-- Lens 3 -->
    <circle cx="172" cy="115" r="17" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="172" cy="115" r="11" fill="#000000" />
    <circle cx="172" cy="115" r="7" fill="url(#lens-glare)" opacity="0.8" />
    <circle cx="170" cy="113" r="2.5" fill="#ffffff" opacity="0.8" />

    <!-- Flash & Mic -->
    <circle cx="172" cy="78" r="6" fill="#fef08a" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="172" cy="151" r="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1" />

    <!-- Corner Airbag Bumpers -->
    <circle cx="84" cy="44" r="6" fill="#ffffff" fill-opacity="0.4" />
    <circle cx="316" cy="44" r="6" fill="#ffffff" fill-opacity="0.4" />
    <circle cx="84" cy="556" r="6" fill="#ffffff" fill-opacity="0.4" />
    <circle cx="316" cy="556" r="6" fill="#ffffff" fill-opacity="0.4" />
  </g>
</svg>
